[project]
name = "api"
version = "0.1.0"
description = "Meal planner API"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.111",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "supabase>=2.32.0",
    "typesafe-sdk>=0.7.4",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "storefront",
]

[tool.uv.sources]
storefront = { workspace = true }
