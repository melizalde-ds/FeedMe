[project]
name = "storefront"
version = "0.1.0"
description = "Mock grocery stores for the shopping agent"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "pympp[stripe]>=0.11.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
